version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unused
    - whitespace
  settings:
    gocyclo:
      min-complexity: 10
    gocritic:
      enabled-tags:
        - performance
        - style
        - experimental
      disabled-checks:
        - wrapperFunc
    govet:
      enable:
        - fieldalignment
        - shadow
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
    rules:
      # stylecheck is folded into staticcheck in v2; keep the ST1016 exclusion.
      - linters:
          - staticcheck
        text: "ST1016"
      # Relax noisy linters for test files; test code favours readability and
      # table-driven structs over micro-optimisation and strict error handling.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gocritic
          - gocyclo
          - govet
          - prealloc

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/bmc-toolbox/bmclib
