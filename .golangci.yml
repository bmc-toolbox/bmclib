version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unused
    - whitespace
  settings:
    gocyclo:
      # 10 is very aggressive for provider code that legitimately branches over
      # hardware states and protocol responses; 20 flags only the real outliers.
      min-complexity: 20
    gocritic:
      enabled-tags:
        - performance
        - style
        - experimental
      disabled-checks:
        - wrapperFunc
    # govet runs its default analyzers. fieldalignment is intentionally left
    # disabled: it is a non-default micro-optimisation that trades struct field
    # grouping/readability for a few padding bytes. The hot inventory-path
    # structs (e.g. the asrockrack sensor/fru/component payloads) are kept
    # field-aligned by hand where it actually matters.
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
    rules:
      # stylecheck is folded into staticcheck in v2; keep the ST1016 exclusion.
      - linters:
          - staticcheck
        text: "ST1016"
      # revive's unused-parameter is noisy: interface-satisfying methods often
      # have fixed signatures with params they don't use, and renaming them to
      # _ loses the self-documenting name. Disable it.
      - linters:
          - revive
        text: "unused-parameter"
      # Relax noisy linters for test files; test code favours readability and
      # table-driven structs over micro-optimisation and strict error handling.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gocritic
          - gocyclo
          - govet
          - prealloc

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/bmc-toolbox/bmclib
